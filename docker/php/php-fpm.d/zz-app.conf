; The application's FPM pool. This REPLACES the base image's www.conf, which the
; Dockerfile deletes.
;
; Why replace rather than layer: www.conf sets `user`/`group`, which only a root
; master process can act on. This image runs as www-data throughout, so those
; directives would warn on every start and do nothing. Running the master as root to
; keep them would put a root process on a public-facing host to gain privilege
; separation inside what is already a single-purpose isolation boundary.

[global]
; The longest line FPM passes on from a worker. A longer line is cut, and the rest
; starts a new line. The base image's docker.conf sets 8192, which split a framework
; JSON record with an exception in its context into two halves that are not JSON.
; Docker still splits a line longer than 16 KB into parts, whatever this value says.
log_limit = 65536

[www]
listen = 9000

; No listen.allowed_clients: nginx connects from its own container address, not
; 127.0.0.1, so an allowlist here would reject every real request. The port is never
; published to the host and only nginx shares the network — that is the boundary.

; Static: the container has a fixed memory limit, so sizing the pool dynamically only
; obscures how much of it can actually be used. 12 x 256M leaves headroom under a 4G
; limit — retune this together with the limit, never independently of it.
pm = static
pm.max_children = 12
pm.max_requests = 1000

; PHP errors go to the worker's stderr, the same path app.ini names. catch_workers_output
; hands each line a worker prints to the master, and the master writes it to the
; container's output: the base image's docker.conf points the master's error_log there.
; decorate_workers_output = no keeps FPM's "child N said into stderr" prefix off each line.
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; Deliberately no slowlog: FPM opens it as a regular file, and pointing it at
; /dev/stderr fails to start on some kernels. Worth adding once someone can verify it
; on a real host — a diagnostic is not worth a container that will not boot.

; The application reads its configuration from the environment; without this, FPM
; would hide it from PHP.
clear_env = no
