; Local development overrides, layered on top of app.ini (loaded after it).
; Copied into the image only by the `dev` target.

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Pick up edits from the bind mount without restarting the container.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.jit = disable

; A hung request should surface as a timeout, not sit for five minutes.
max_execution_time = 60
