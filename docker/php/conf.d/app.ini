; Production PHP settings for the application image.
;
; The php:8.4-fpm base image ships NO php.ini at all — every value below is otherwise
; a compile default, and opcache is off. This file replaces the four per-environment
; php.ini files the IIS hosting used.
;
; docker/php/conf.d/dev.ini overrides these for local development.

; --- error handling -------------------------------------------------------------
; Errors go to the log, never to the response body: an API returns its own JSON error
; shape, and a PHP notice rendered into a response leaks paths and code structure.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED

; Do not advertise the PHP version in response headers.
expose_php = Off

; --- opcache --------------------------------------------------------------------
; The image is immutable, so the filesystem cannot change under a running container:
; timestamp validation is pure overhead. This is safe ONLY because a deploy replaces
; the container rather than the files inside it.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; JIT off. It pays off on CPU-bound numeric code; an API whose time goes on Mongo I/O
; and JSON serialisation sees no benefit from it, and it has a history of subtle bugs.
; Turn it on for a specific workload that measures faster with it, not by default.
opcache.jit = disable

; --- limits ---------------------------------------------------------------------
; upload_max_filesize and post_max_size must not be smaller than nginx's
; client_max_body_size (1024m), or a large upload is accepted by nginx and then
; rejected by PHP after the whole body has already crossed the wire.
memory_limit = 256M
upload_max_filesize = 1024M
post_max_size = 1024M
max_execution_time = 300
max_input_time = 300
max_file_uploads = 50

; --- sessions and temp ----------------------------------------------------------
; Both live inside the container and are lost on redeploy. Applications that need
; durable sessions must not use the filesystem handler.
session.save_path = /var/www/app/srv/tmp/sessions
sys_temp_dir = /var/www/app/srv/tmp/tmp
upload_tmp_dir = /var/www/app/srv/tmp/tmp

; --- misc -----------------------------------------------------------------------
date.timezone = America/New_York
zend.assertions = -1
