name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The prod image is php:8.4-fpm; composer.lock is resolved for that platform
  # (see config.platform in composer.json). Keep these in step.
  PHP_VERSION: '8.4'

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mongodb, sodium, fileinfo, pdo, imagick
          tools: composer:v2
          coverage: none
      # Installs from the committed composer.lock. gcgov/framework resolves through
      # the vcs repository in composer.json until v7.0.0-rc.1 is tagged.
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer phpstan

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mongodb, sodium, fileinfo, pdo, imagick
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test

  nginx:
    name: Nginx config lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render the template and validate nginx config
        run: |
          docker run --rm \
            -e PHP_FPM_HOST=php:9000 \
            -e CORS_ORIGIN_APP=http://localhost:8080 \
            -e CORS_ORIGIN_FRONTEND=http://localhost:5173 \
            -e CORS_ORIGIN_SWAGGER=http://localhost:8081 \
            -e NGINX_ENVSUBST_FILTER='^(CORS_ORIGIN_|PHP_FPM_HOST)' \
            -v "$PWD/docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            nginx:1.27-alpine \
            sh -c 'set -e; /docker-entrypoint.sh nginx -t'

  docker-build:
    name: Docker build (prod target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build --target prod -t framework-app-template:ci .
      - name: Image contains the committed config.json
        run: docker run --rm --entrypoint test framework-app-template:ci -f config.json
